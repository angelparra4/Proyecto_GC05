
name: SonarQube C2

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  analyze:
    name: Analisis SonarQube C2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y generar cobertura
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=lcov
      - name: Cache SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Authenticate with SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@v1.2
        id: auth

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.5.0
