
name: SonarQube C2

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  analyze:
    name: Analisis SonarQube C2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Authenticate with SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@v1.2
        id: auth

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.5.0
